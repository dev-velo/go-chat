<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; Ask Dave</title>
    <style>
        :root {
            --bg: #eef1f5;
            --panel: #ffffff;
            --ink: #1c2430;
            --muted: #5e6b7c;
            --line: #d5dbe3;
            --accent: #2451c7;
            --accent-ink: #ffffff;
            --error: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        main { max-width: 360px; margin: 0 auto; padding: 72px 20px 60px; }
        h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
        .sub { color: var(--muted); margin: 0 0 24px; }
        form {
            display: flex; flex-direction: column; gap: 12px;
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 20px;
        }
        label { font-size: 14px; font-weight: 600; }
        input {
            width: 100%; font: inherit; color: inherit; margin-top: 6px;
            padding: 10px; border: 1px solid var(--line); border-radius: 8px;
            background: transparent;
        }
        button {
            border: 0; border-radius: 8px; padding: 11px 18px; margin-top: 4px;
            background: var(--accent); color: var(--accent-ink);
            font: inherit; font-weight: 600; cursor: pointer;
        }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .error { color: var(--error); font-size: 14px; margin: 0; }
    </style>
</head>
<body>
<main>
    <h1>Ask Dave</h1>
    <p class="sub">Sign in to continue.</p>

    <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ .Next }}">
        {{ with .Error }}<p class="error" role="alert">{{ . }}</p>{{ end }}
        <div>
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" autocapitalize="off"
                   autocorrect="off" spellcheck="false" required autofocus>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
