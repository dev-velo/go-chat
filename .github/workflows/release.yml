name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release must finish once it starts, so queue rather than cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the generated notes can diff against the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Reuses the module and build caches the test job just populated.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # The same flags scripts/run.sh uses, so the released zip matches what a
      # local deploy would have built.
      - name: Build the Lambda package
        working-directory: app
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd
          zip -q -j -FS "$GITHUB_WORKSPACE/dist/bootstrap.zip" bootstrap
          rm bootstrap

      - name: Build the standalone binaries
        working-directory: app
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            staging="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$staging/go-chat" ./cmd
            cp ../LICENSE ../README.md "$staging/"
            tar -czf "$GITHUB_WORKSPACE/dist/go-chat_${VERSION}_${os}_${arch}.tar.gz" \
              -C "$staging" .
            rm -rf "$staging"
          done

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
